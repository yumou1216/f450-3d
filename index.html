<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>F450 四旋翼 · 交互式 3D 拆解</title>
<style>
  :root{
    --bg0:#05070d; --bg1:#0a1020; --bg2:#0d1526;
    --cyan:#4dd8ff; --cyan-dim:rgba(77,216,255,.16);
    --orange:#ff9440; --text:#dbe7f5; --text-dim:#8fa3bd;
    --panel:rgba(11,18,33,.86); --line:rgba(94,200,255,.16);
    --font:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font);color:var(--text)}
  body{
    background:
      radial-gradient(1200px 700px at 50% 18%, #10203c 0%, transparent 60%),
      radial-gradient(900px 600px at 80% 90%, #0c1a30 0%, transparent 55%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 100%);
  }
  #scene{position:fixed;inset:0;display:block;cursor:grab}
  #scene.dragging{cursor:grabbing}
  #scene.pointing{cursor:pointer}

  /* ---------- 顶部标题 ---------- */
  #title-bar{
    position:fixed;top:0;left:0;right:0;z-index:20;pointer-events:none;
    display:flex;align-items:flex-start;justify-content:space-between;
    padding:16px 20px 0;
  }
  #title-bar .block{pointer-events:auto}
  h1{
    font-size:19px;font-weight:700;letter-spacing:.5px;
    display:flex;align-items:center;gap:10px;
    text-shadow:0 0 18px rgba(77,216,255,.35);
  }
  h1 .logo{
    width:10px;height:10px;background:var(--cyan);border-radius:2px;
    box-shadow:0 0 12px var(--cyan);transform:rotate(45deg);flex:none;
  }
  .subtitle{margin-top:6px;font-size:11.5px;color:var(--text-dim);letter-spacing:.4px}
  .subtitle b{color:var(--cyan);font-weight:600}
  #status-pill{
    margin-top:9px;display:inline-flex;align-items:center;gap:7px;
    font-size:11px;color:#ffd9ad;background:rgba(255,148,64,.09);
    border:1px solid rgba(255,148,64,.3);border-radius:99px;padding:4px 11px;
  }
  #status-pill i{
    width:6px;height:6px;border-radius:50%;background:var(--orange);
    box-shadow:0 0 8px var(--orange);animation:blink 1.6s infinite;flex:none;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---------- 玻璃面板通用 ---------- */
  .glass{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:0 8px 32px rgba(0,0,0,.45);
  }

  /* ---------- 左侧部件清单 ---------- */
  #parts-panel{
    position:fixed;left:16px;top:118px;bottom:96px;width:252px;z-index:20;
    display:flex;flex-direction:column;overflow:hidden;
    transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s;
  }
  #parts-panel.hidden{transform:translateX(-115%);opacity:0;pointer-events:none}
  #parts-panel .head{
    padding:13px 15px 10px;border-bottom:1px solid var(--line);flex:none;
  }
  #parts-panel .head .t{font-size:13.5px;font-weight:700;letter-spacing:1px}
  #parts-panel .head .s{font-size:10.5px;color:var(--text-dim);margin-top:3px}
  #overview-card{
    margin:10px 10px 4px;padding:10px 12px;flex:none;
    background:linear-gradient(135deg,rgba(77,216,255,.08),rgba(77,216,255,.02));
    border:1px solid rgba(77,216,255,.18);border-radius:9px;font-size:11px;
  }
  #overview-card .row{display:flex;justify-content:space-between;padding:2.5px 0}
  #overview-card .row span:first-child{color:var(--text-dim)}
  #overview-card .row span:last-child{color:var(--text);font-weight:500}
  #parts-list{flex:1;overflow-y:auto;padding:6px 8px 12px}
  #parts-list::-webkit-scrollbar{width:4px}
  #parts-list::-webkit-scrollbar-thumb{background:rgba(77,216,255,.25);border-radius:4px}
  .cat-title{
    font-size:10px;color:var(--cyan);letter-spacing:2px;font-weight:700;
    padding:10px 8px 5px;display:flex;align-items:center;gap:7px;
  }
  .cat-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(77,216,255,.3),transparent)}
  .part-item{
    display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;
    cursor:pointer;border:1px solid transparent;transition:all .18s;margin:1px 0;
  }
  .part-item:hover{background:rgba(77,216,255,.07);border-color:rgba(77,216,255,.14)}
  .part-item.active{background:rgba(77,216,255,.13);border-color:rgba(77,216,255,.45)}
  .part-item .dot{
    width:7px;height:7px;border-radius:2px;background:#5a6b82;flex:none;
    transform:rotate(45deg);transition:all .2s;
  }
  .part-item.active .dot{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
  .part-item .nm{font-size:12px;font-weight:600;line-height:1.25}
  .part-item .md{font-size:10px;color:var(--text-dim);line-height:1.3;margin-top:1px}
  .part-item .qty{
    margin-left:auto;font-size:9.5px;color:var(--cyan);flex:none;
    border:1px solid rgba(77,216,255,.3);border-radius:4px;padding:1px 5px;
  }

  /* ---------- 右侧详情面板 ---------- */
  #detail-panel{
    position:fixed;right:16px;top:118px;width:288px;max-height:calc(100% - 220px);
    z-index:20;overflow:hidden;display:flex;flex-direction:column;
    opacity:0;transform:translateX(30px);pointer-events:none;
    transition:all .3s cubic-bezier(.2,.8,.2,1);
  }
  #detail-panel.show{opacity:1;transform:none;pointer-events:auto}
  #detail-panel .head{
    padding:14px 16px 11px;border-bottom:1px solid var(--line);flex:none;position:relative;
  }
  #detail-panel .cat{font-size:10px;color:var(--cyan);letter-spacing:2px}
  #detail-panel h2{font-size:16px;margin-top:4px;letter-spacing:.5px}
  #detail-panel .model{font-size:11px;color:var(--orange);margin-top:4px;font-weight:500}
  #detail-close{
    position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:6px;
    border:1px solid var(--line);background:transparent;color:var(--text-dim);
    font-size:14px;line-height:1;cursor:pointer;transition:all .15s;
  }
  #detail-close:hover{color:var(--cyan);border-color:var(--cyan)}
  #detail-body{overflow-y:auto;padding:12px 16px 16px}
  #detail-body::-webkit-scrollbar{width:4px}
  #detail-body::-webkit-scrollbar-thumb{background:rgba(77,216,255,.25);border-radius:4px}
  .sec-title{
    font-size:10px;color:var(--cyan);letter-spacing:2px;font-weight:700;
    margin:12px 0 6px;display:flex;align-items:center;gap:7px;
  }
  .sec-title:first-child{margin-top:0}
  .sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(77,216,255,.3),transparent)}
  .spec-table{width:100%;font-size:11.5px;border-collapse:collapse}
  .spec-table td{padding:4.5px 0;border-bottom:1px dashed rgba(140,170,210,.12);vertical-align:top}
  .spec-table td:first-child{color:var(--text-dim);width:76px}
  .spec-table td:last-child{color:var(--text);font-weight:500}
  .pos-box{
    font-size:11.5px;line-height:1.65;color:var(--text);
    background:rgba(77,216,255,.06);border-left:2px solid var(--cyan);
    padding:8px 10px;border-radius:0 7px 7px 0;
  }
  .wire-list{list-style:none}
  .wire-list li{
    font-size:11px;line-height:1.6;color:var(--text);padding:5px 0 5px 16px;
    position:relative;border-bottom:1px dashed rgba(140,170,210,.1);
  }
  .wire-list li::before{
    content:"";position:absolute;left:2px;top:11px;width:6px;height:6px;
    border:1.5px solid var(--orange);border-radius:50%;
  }
  .note-box{
    font-size:11px;line-height:1.65;color:#ffd9ad;
    background:rgba(255,148,64,.07);border:1px dashed rgba(255,148,64,.35);
    border-radius:7px;padding:8px 10px;margin-top:4px;
  }

  /* ---------- 底部控制条 ---------- */
  #control-bar{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;
    display:flex;align-items:center;gap:14px;padding:10px 16px;max-width:calc(100vw - 24px);
  }
  #explode-slider-wrap{display:flex;align-items:center;gap:10px;min-width:190px}
  #explode-slider-wrap .lbl{font-size:10.5px;color:var(--text-dim);letter-spacing:1px;white-space:nowrap}
  #explode-slider-wrap .pct{font-size:10.5px;color:var(--cyan);width:34px;text-align:right;font-variant-numeric:tabular-nums}
  input[type=range]{
    -webkit-appearance:none;width:150px;height:3px;border-radius:3px;outline:none;
    background:linear-gradient(90deg,var(--cyan) var(--fill,0%),rgba(120,160,200,.25) var(--fill,0%));
    cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:#dff5ff;border:2px solid var(--cyan);box-shadow:0 0 10px rgba(77,216,255,.8);
  }
  .btn-group{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  .cbtn{
    font-family:var(--font);font-size:11.5px;letter-spacing:1px;color:var(--text);
    background:rgba(77,216,255,.06);border:1px solid var(--line);border-radius:8px;
    padding:7px 13px;cursor:pointer;transition:all .18s;white-space:nowrap;
  }
  .cbtn:hover{border-color:rgba(77,216,255,.5);color:#fff;background:rgba(77,216,255,.12)}
  .cbtn.on{
    color:#04121c;background:var(--cyan);border-color:var(--cyan);font-weight:700;
    box-shadow:0 0 14px rgba(77,216,255,.45);
  }
  .cbtn.primary{
    background:linear-gradient(135deg,#2ab8e8,#4dd8ff);color:#04121c;font-weight:700;
    border-color:transparent;box-shadow:0 2px 14px rgba(77,216,255,.35);
  }
  .cbtn.primary:hover{filter:brightness(1.12)}

  /* ---------- 3D 标注 ---------- */
  #labels{position:fixed;inset:0;z-index:12;pointer-events:none;overflow:hidden}
  .lab{
    position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    transition:opacity .25s;will-change:left,top;
  }
  .lab .tag{
    font-size:10.5px;letter-spacing:.5px;color:#e8f6ff;white-space:nowrap;
    background:rgba(8,16,30,.85);border:1px solid rgba(77,216,255,.4);
    border-radius:5px;padding:3px 8px;
    text-shadow:0 0 8px rgba(77,216,255,.5);
    backdrop-filter:blur(4px);
  }
  .lab .stem{width:1px;height:14px;background:linear-gradient(180deg,rgba(77,216,255,.7),transparent)}
  .lab.sel .tag{background:rgba(77,216,255,.25);border-color:var(--cyan);color:#fff}
  .lab:hover .tag{border-color:var(--cyan)}

  /* ---------- 操作提示 ---------- */
  #hint-layer{
    position:fixed;right:16px;bottom:18px;z-index:19;display:flex;flex-direction:column;
    align-items:flex-end;gap:6px;transition:opacity .5s;
  }
  #hint-layer.fade{opacity:0;pointer-events:none}
  .hint-item{
    font-size:10.5px;color:var(--text-dim);background:rgba(10,16,30,.7);
    border:1px solid rgba(94,200,255,.12);border-radius:6px;padding:4px 10px;
    display:flex;align-items:center;gap:7px;backdrop-filter:blur(6px);
  }
  .hint-item kbd{
    font-family:var(--font);font-size:9.5px;color:var(--cyan);
    border:1px solid rgba(77,216,255,.35);border-radius:3px;padding:0 5px;line-height:15px;
  }
  #help-btn{
    position:fixed;right:16px;bottom:18px;z-index:21;width:30px;height:30px;border-radius:50%;
    border:1px solid var(--line);background:var(--panel);color:var(--cyan);font-size:14px;
    cursor:pointer;display:none;place-items:center;backdrop-filter:blur(8px);
  }
  #help-btn.show{display:grid}
  #hint-layer:not(.fade) ~ #help-btn{display:none}

  /* ---------- 移动端适配 ---------- */
  #panel-toggle{
    position:fixed;left:16px;top:118px;z-index:21;display:none;
    font-size:11px;padding:8px 12px;
  }
  @media (max-width:900px){
    #parts-panel{width:230px;top:108px;bottom:150px}
    #detail-panel{width:min(300px,calc(100vw - 32px));top:auto;bottom:150px;max-height:46vh}
    #control-bar{flex-direction:column;gap:9px;padding:9px 12px;bottom:10px;width:calc(100vw - 20px)}
    #explode-slider-wrap{width:100%;min-width:0}
    input[type=range]{flex:1;width:auto}
    #panel-toggle{display:block}
    #parts-panel.hidden-mobile{transform:translateX(-115%);opacity:0;pointer-events:none}
    #hint-layer{display:none}
    h1{font-size:15px}
    .subtitle{font-size:10px}
    #title-bar{padding:10px 12px 0}
  }

  /* ---------- 加载遮罩 ---------- */
  #loading{
    position:fixed;inset:0;z-index:99;background:var(--bg0);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    transition:opacity .7s;
  }
  #loading.done{opacity:0;pointer-events:none}
  #loading .ring{
    width:44px;height:44px;border-radius:50%;
    border:2px solid rgba(77,216,255,.15);border-top-color:var(--cyan);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading .txt{font-size:12px;letter-spacing:4px;color:var(--text-dim)}
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="title-bar">
  <div class="block">
    <h1><span class="logo"></span>F450 四旋翼 · 交互式 3D 拆解</h1>
    <div class="subtitle">飞控 <b>Pixhawk 6C mini</b> · 分电 <b>PM06 V2</b> · 电调 <b>好盈天行者 30A</b> · 电机 <b>X2216 KV950</b></div>
    <div id="status-pill"><i></i>项目状态：已完成首飞 · 正在排查姿态侧翻（PID 调参中）</div>
  </div>
</div>

<button id="panel-toggle" class="cbtn">☰ 部件清单</button>

<aside id="parts-panel" class="glass hidden-mobile">
  <div class="head">
    <div class="t">部件清单</div>
    <div class="s">点击部件定位 · 数据来自实际组装记录</div>
  </div>
  <div id="overview-card"></div>
  <div id="parts-list"></div>
</aside>

<section id="detail-panel" class="glass">
  <div class="head">
    <div class="cat" id="d-cat">核心电子设备</div>
    <h2 id="d-name">部件名称</h2>
    <div class="model" id="d-model">型号</div>
    <button id="detail-close">✕</button>
  </div>
  <div id="detail-body"></div>
</section>

<div id="control-bar" class="glass">
  <div id="explode-slider-wrap">
    <span class="lbl">拆解程度</span>
    <input type="range" id="explode-slider" min="0" max="100" value="0">
    <span class="pct" id="explode-pct">0%</span>
  </div>
  <div class="btn-group">
    <button class="cbtn primary" id="btn-explode">一键拆解</button>
    <button class="cbtn" id="btn-xray">X 光</button>
    <button class="cbtn on" id="btn-wires">线缆</button>
    <button class="cbtn" id="btn-labels">标注</button>
    <button class="cbtn" id="btn-demo">自动演示</button>
    <button class="cbtn" id="btn-reset">复位视角</button>
  </div>
</div>

<div id="hint-layer">
  <div class="hint-item"><kbd>拖动</kbd>旋转视角 · <kbd>滚轮</kbd>缩放 · <kbd>右键</kbd>平移</div>
  <div class="hint-item"><kbd>点击</kbd>部件查看详情与接线关系</div>
  <div class="hint-item"><kbd>空格</kbd>拆解 / 装配 · <kbd>X</kbd> X光 · <kbd>L</kbd> 标注 · <kbd>R</kbd> 复位</div>
</div>
<button id="help-btn">?</button>

<div id="labels"></div>
<div id="loading"><div class="ring"></div><div class="txt">F450 部件加载中</div></div>

<script src="lib/three.min.js"></script>
<script src="main.js"></script>
</body>
</html>
